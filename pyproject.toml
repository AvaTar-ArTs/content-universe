[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "content-universe"
version = "0.1.0"
description = "Provenance-aware creative harvesting and catalog core"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "AvaTar-ArTs"}]
dependencies = []

[project.scripts]
content-universe = "content_universe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
